# ---------------------------------------------------------------
# Hospital Auto-Apply — settings
# Edit this file, then restart the app (sudo systemctl restart autoapply)
# ---------------------------------------------------------------

# How the bot behaves when it finds a good match:
#   approve = fill the form, screenshot it, email you, wait for you to tap "Approve & submit"  (recommended)
#   auto    = fill AND submit straight away, then email you
mode: approve          # keep this: you approve every submission

# How often to check for new jobs (minutes)
check_every_minutes: 60

# Only consider jobs whose title contains one of these (case-insensitive)
include_keywords:
  - patient services
  - patient service
  - psa
  - patient support
  - patient transport
  - ward assistant
  - wardsperson
  - orderly
  - environmental services
  - hospital assistant
  - support services assistant
  - food services assistant
  - ward support
  - ancillary assistant
  - clinical assistant
  - ward services

# Skip any job whose title contains one of these
exclude_keywords:
  - nurse
  - nursing
  - midwife
  - manager
  - director
  - coordinator
  - team leader
  - supervisor
  - educator
  - pharmacist
  - registrar
  - medical officer
  - doctor
  - specialist
  - consultant
  - therapist
  - psychologist

# AI match score (0-100) needed before the bot prepares an application
min_match_score: 65

# Claude model used for matching and cover letters
ai_model: claude-sonnet-5-5

# ---------------------------------------------------------------
# Hospitals to watch.
#   platform: successfactors  -> fully supported (search + auto-fill)
#   platform: workday         -> watch only for now (you'll get an email with the link)
#   login_env: name prefix for this site's login in .env, e.g. WESTERN_EMAIL / WESTERN_PASSWORD
# ---------------------------------------------------------------
hospitals:
  - name: Western Health (Sunshine, Footscray, Williamstown)
    careers_url: https://careers.wh.org.au
    platform: successfactors
    login_env: WESTERN
    enabled: true

  - name: Eastern Health (Box Hill, Maroondah, Angliss)
    careers_url: https://careers.easternhealth.org.au
    platform: successfactors
    login_env: EASTERN
    enabled: true

  - name: Royal Children's Hospital
    careers_url: https://careers.rch.org.au
    platform: successfactors
    login_env: RCH
    enabled: true

  - name: Austin Health (Austin, Heidelberg Repat, Royal Talbot)
    careers_url: https://careers.austin.org.au
    platform: successfactors
    login_env: AUSTIN
    enabled: true

  - name: Monash Health
    careers_url: https://careers.monashhealth.org
    platform: successfactors
    login_env: MONASH
    enabled: false

  - name: Peter MacCallum Cancer Centre
    careers_url: https://careers.petermac.org
    platform: successfactors
    login_env: PETERMAC
    enabled: false

  # Northern Health uses the older SuccessFactors board: the robot FINDS jobs and writes the
  # letter, then emails you the link (no automatic form filling there yet).
  - name: Northern Health (The Northern Hospital, Epping)
    careers_url: https://career10.successfactors.com/career?company=northernhe
    platform: successfactors_legacy
    login_env: NORTHERN
    enabled: true

  # Royal Melbourne Hospital (Parkville, Royal Park) - same type of site as Western/Austin.
  # Its PSA-type job is called "Clinical Assistant".
  - name: Royal Melbourne Hospital (Parkville, Royal Park)
    careers_url: https://careers.thermh.org.au
    platform: successfactors
    login_env: RMH
    enabled: true

  # Bayside Health (The Alfred, Sandringham, Caulfield, Williamstown...) uses PageUp: the app FINDS
  # jobs and writes the letter, then sends you the link to apply (no automatic form filling).
  # Its PSA-type jobs are "Ward Support Assistant", "Ancillary Assistant", "Patient Services Assistant".
  - name: Bayside Health (The Alfred, Sandringham, Caulfield)
    careers_url: https://careers.alfredhealth.org.au
    platform: pageup
    login_env: ALFRED
    enabled: true

  # St Vincent's uses Workday. Watch-only in this version.
  - name: St Vincent's Hospital Melbourne
    careers_url: https://www.svhm.org.au/careers
    platform: workday
    login_env: SVHM
    enabled: false
