{% extends "base.html" %}
{% block body %}
<section class="hero" style="text-align:center">
  <img src="/static/logo.svg" alt="" style="width:64px;height:64px;border-radius:16px">
  <h1 style="color:#fff;margin-top:10px">Welcome to PulseApply</h1>
  <p class="muted" style="margin:0">One-time setup. Everything stays on your own server.</p>
</section>
<section class="card">
  <form method="post" action="/setup" autocomplete="off">
    <label for="sc">Setup code <span class="muted">(from your Vultr startup script)</span></label><input id="sc" type="text" name="setup_code" required autocapitalize="off">
    <label for="dp">Choose a dashboard password <span class="muted">(10+ characters)</span></label><input id="dp" type="password" name="dashboard_password" minlength="10" required>
    <label for="ak">Claude API key <span class="muted">(starts with sk-ant-)</span></label><input id="ak" type="text" name="anthropic_key" required autocapitalize="off">
    <label for="gm">Your Gmail address</label><input id="gm" type="email" name="gmail" required autocapitalize="off">
    <label for="gp">Gmail app password <span class="muted">(16 letters)</span></label><input id="gp" type="text" name="gmail_app_password" required autocapitalize="off">
    <label for="nt">Send notifications to <span class="muted">(blank = same Gmail)</span></label><input id="nt" type="email" name="notify_to" autocapitalize="off">
    <p><button class="btn-block">Save and start</button></p>
  </form>
</section>
{% endblock %}
